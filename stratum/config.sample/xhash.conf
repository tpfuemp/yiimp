[STRATUM]
algo = xhash
; Parallax uses the ethash share scale: target = 2^224 / difficulty.
; 0.1 suits small GPUs (~1 share/min); use more for faster rigs.
difficulty = 0.1
; Vardiff aims at about 1 share/min (spm_min..spm_max).
diff_min = 0.01
diff_max = 100
spm_min = 0.5
spm_max = 2
max_ttf = 50000
autoexchange = 0
; Optional: bind every login on this port to one coin row (coins.id). Useful
; when an EVM address is already bound to another chain in the accounts
; table; an existing binding stays, this port mines the configured coin.
;coinid = 0

; The node must expose xhash_getWork / xhash_submitWork and the usual eth_*
; block queries, with the pool payout address configured as beneficiary.
; Coin RPC host/port come from the coins row (GETH encoding). Parallax
; coinbase maturity is 100 blocks; configure payouts accordingly.
