[STRATUM]
algo = etchash
; Ethash difficulty uses the standard 2^32 scale: target = 2^224 / difficulty,
; so the raw target difficulty is difficulty * 2^32 (e.g. 0.1 -> 429.5M).
; Rigel shows this as "429.50M (0.10)". 0.1 suits small GPUs (~1 share/min);
; use a larger value for faster rigs to avoid flooding the pool with shares.
difficulty = 0.1
; Vardiff aims at about 1 share/min (spm_min..spm_max). Keep diff_min low:
; the default difficulty/2 would stop a miner starting at sd=0.01.
diff_min = 0.01
diff_max = 100
spm_min = 0.5
spm_max = 2
max_ttf = 50000
; Password sd=X sets the starting difficulty, e.g. -p c=ETC,mc=ETC,sd=0.1.
; d=X does the same, or fixes it with allow_static_diff = true.

; ECIP-1099 defaults for ETC mainnet: 60000 blocks/epoch after block
; 11700000, preserving epoch 390 at the fork. Override for other Etchash
; chains (e.g. Mordor: fork block 2520000, fork epoch 84).
;[ETHASH]
;epoch_length = 60000
;seed_epoch_length = 30000
;etchash_fork_block = 11700000
;etchash_fork_epoch = 0
;epoch_offset = 0
;chain_id = 61
;dag_init_size = 1073741824

; The pool must run a PoW-capable Ethereum node (core-geth / Besu / ERIGON in
; Etchash mode) with eth_getWork and eth_submitWork enabled and the pool's
; beneficiary address configured on the node.
